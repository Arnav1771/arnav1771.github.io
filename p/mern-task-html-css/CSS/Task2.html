<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Combined Navigation Bars</title>
   <style>
      body {
         margin: 0;
         padding: 0;
         height: 100vh;
         background-color: #f0f0f0;
         display: flex; /* Set the body as a flex container */
         justify-content: center; /* Center the content horizontally */
         align-items: center; /* Center the content vertically */
      }

      #container {
         display: flex;
         justify-content: space-between;
         align-items: flex-start;
         padding: 20px;
         width: 70%; /* Adjust the width as needed */
      }

      .navContainer {
         display: inline-block;
         width: 200px;
         border: 2px solid #ccc;
         background-color: #87CEFA;
         padding: 10px;
         text-align: center;
         margin: auto; /* Center the navContainer */
      }

      .navContainer + .navContainer {
         margin-left: 20px; /* Adjust the spacing between navContainers */
      }

      .navContainer a {
         display: block;
         padding: 8px;
         text-decoration: none;
         color: #333;
      }

      .navContainer a:hover {
         background-color: #FFA500; /* Orange on hover */
         color: #fff;
      }

      .navTitle {
         font-size: 18px;
         font-weight: bold;
         margin-bottom: 10px;
         color: #333;
      }

      ul {
         list-style-type: none;
         margin: 0;
         padding: 0;
         overflow: hidden;
         background-color: #cfcbcb;
      }

      li {
         float: left;
         border-right:1px solid #bbb;
      }

      li:last-child {
         border-right: none;
      }

      li a {
         display: block;
         color: rgb(44, 30, 231);
         text-align: center;
         padding: 14px 16px;
         text-decoration: none;
      }

      li a:hover:not(.active) {
         background-color: #666464;
         color: aliceblue;
      }

      .active {
         background-color: #abaeae;
         color: aliceblue;
      }

      .box {
         border:1px solid black;
         width: 207px;
      }
   </style>
</head>
<body>
   <div id="container">
      <div class="navContainer">
         <div class="navTitle">Vertical Navigation Bar</div>
         <a href="#">Home</a>
         <a href="#">JAVA</a>
         <a href="#">CSS</a>
         <a href="#">HTML</a>
         <a href="#">Bootstrap</a>
      </div>
      <div class="navContainer">
         <div class="navTitle">Horizontal Navigation Bar</div>
         <div class="box">
            <ul style="width: 215px;margin: 9px;">
               <li><a class="active" href="#home">Home</a></li>
               <li><a href="#news">Java</a></li>
               <li><a href="#contact">HTML</a></li>
               <li><a href="#contact">CSS</a></li>
               <li><a href="#contact"></a></li>
            </ul>
         </div>
      </div>
   </div>
</body>
</html>
