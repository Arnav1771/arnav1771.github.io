<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>3D Raycaster — Arcade</title>
<style>
  :root { --accent: #a855f7; --bg: #070b1a; --panel: rgba(255,255,255,0.05); --line: rgba(255,255,255,0.12); }
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0; padding: 64px 12px 20px; background: var(--bg); color: #e7ecff;
    font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column;
    align-items: center; min-height: 100vh;
  }
  .hud {
    width: min(640px, 98vw); display: flex; justify-content: space-between; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 18px;
    margin-bottom: 12px; font-weight: 700; font-size: 14px;
  }
  .badge { color: var(--accent); font-size: 16px; }
  .view-container {
    position: relative; width: min(640px, 98vw); aspect-ratio: 16 / 9;
    border: 2px solid var(--line); border-radius: 16px; overflow: hidden; background: #000;
    box-shadow: 0 12px 36px rgba(0,0,0,0.6);
  }
  canvas#renderCanvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  canvas#minimapCanvas {
    position: absolute; top: 10px; right: 10px; width: 110px; height: 110px;
    border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; background: rgba(0,0,0,0.7);
    pointer-events: none;
  }
  .controls-panel {
    width: min(640px, 98vw); margin-top: 14px; display: grid;
    grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 380px;
  }
  .btn {
    background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-radius: 12px;
    color: #fff; font-size: 20px; font-weight: 800; padding: 14px 0; text-align: center;
    user-select: none; cursor: pointer; transition: background 0.15s, transform 0.1s;
  }
  .btn:active { background: var(--accent); color: #000; transform: scale(0.95); }
  .btn-wide { grid-column: span 3; font-size: 15px; background: var(--accent); color: #070b1a; }
  .modal {
    position: absolute; inset: 0; background: rgba(7,11,26,0.92); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 20px; text-align: center; z-index: 10;
  }
  .modal h2 { margin: 0 0 10px; color: var(--accent); font-size: 28px; }
  .modal p { color: #a6b4c9; margin: 0 0 20px; font-size: 15px; max-width: 320px; }
  .modal button {
    background: var(--accent); border: none; padding: 12px 28px; font-size: 16px;
    font-weight: 800; border-radius: 999px; cursor: pointer; color: #070b1a;
  }
</style>
<style>
/* Mobile Phone Portrait & Landscape Responsive Enhancements */
@media (orientation: portrait) {
  body {
    flex-direction: column !important;
    justify-content: flex-start !important;
    padding-top: max(12px, env(safe-area-inset-top)) !important;
    padding-bottom: max(16px, env(safe-area-inset-bottom)) !important;
  }
  .game-container, .view-container, canvas {
    max-width: 98vw !important;
  }
}
@media (orientation: landscape) {
  body {
    flex-direction: row !important;
    justify-content: center !important;
    align-items: center !important;
    padding-left: max(16px, env(safe-area-inset-left)) !important;
    padding-right: max(16px, env(safe-area-inset-right)) !important;
  }
  .hud {
    margin-bottom: 0 !important;
    margin-right: 12px !important;
  }
}
</style>
</head>
<body>

<div class="hud">
  <div>LEVEL: <span id="levelVal" class="badge">1</span> / 20</div>
  <div>NODES: <span id="nodesVal" class="badge">0</span></div>
  <div>SCORE: <span id="scoreVal" class="badge">0</span></div>
</div>

<div class="view-container">
  <canvas id="renderCanvas" width="320" height="180"></canvas>
  <canvas id="minimapCanvas" width="110" height="110"></canvas>
  
  <div id="overlayModal" class="modal" style="display:none;">
    <h2 id="modalTitle">3D Raycaster</h2>
    <p id="modalDesc">Collect all data crystals to activate the exit portal and clear the level!</p>
    <button id="modalBtn" onclick="nextLevel()">START LEVEL 1</button>
  </div>
</div>

<div class="controls-panel">
  <div></div>
  <div class="btn" id="btnFwd">▲</div>
  <div></div>
  <div class="btn" id="btnLeft">◄</div>
  <div class="btn" id="btnBack">▼</div>
  <div class="btn" id="btnRight">►</div>
</div>

<script src="../../assets/js/audio.js"></script>
<script src="../../assets/js/arcade.js"></script>
<script>
  Arcade.mount({ title: '3D Raycaster', accent: '#a855f7', slug: '3d-raycaster' });

  const rCanvas = document.getElementById('renderCanvas');
  const rCtx = rCanvas.getContext('2d');
  const mCanvas = document.getElementById('minimapCanvas');
  const mCtx = mCanvas.getContext('2d');

  let level = 1;
  let score = 0;
  let mapSize = 9;
  let map = [];
  let items = [];
  let player = { x: 1.5, y: 1.5, dir: 0, fov: Math.PI / 3 };
  let exitPos = { x: 0, y: 0 };
  let isPlaying = false;

  const TEX_WALL = ['#4c1d95', '#6d28d9', '#5b21b6', '#7c3aed', '#3b0764'];

  function generateMaze(size) {
    let m = Array(size).fill(0).map(() => Array(size).fill(1));
    for (let r = 1; r < size - 1; r++) {
      for (let c = 1; c < size - 1; c++) {
        if (Math.random() > 0.35 || r % 2 === 1 && c % 2 === 1) m[r][c] = 0;
      }
    }
    m[1][1] = 0;
    let itemsNeeded = Math.min(10, 2 + Math.floor(level / 2));
    items = [];
    while (items.length < itemsNeeded) {
      let rx = Math.floor(Math.random() * (size - 2)) + 1;
      let ry = Math.floor(Math.random() * (size - 2)) + 1;
      if (m[ry][rx] === 0 && (rx !== 1 || ry !== 1)) {
        items.push({ x: rx + 0.5, y: ry + 0.5, collected: false });
      }
    }
    exitPos = { x: size - 1.5, y: size - 1.5 };
    m[size - 2][size - 2] = 0;
    return m;
  }

  function startLevel(lvl) {
    level = lvl;
    mapSize = Math.min(19, 7 + Math.floor(level / 2) * 2);
    map = generateMaze(mapSize);
    player.x = 1.5;
    player.y = 1.5;
    player.dir = 0;
    document.getElementById('levelVal').textContent = level;
    document.getElementById('nodesVal').textContent = items.length;
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('overlayModal').style.display = 'none';
    isPlaying = true;
    if (window.Arcade) Arcade.report('3d-raycaster', level - 1, 20);
  }

  function render() {
    if (!isPlaying) { requestAnimationFrame(render); return; }

    // Ceiling & Floor
    rCtx.fillStyle = '#0a0518';
    rCtx.fillRect(0, 0, rCanvas.width, rCanvas.height / 2);
    rCtx.fillStyle = '#170f2c';
    rCtx.fillRect(0, rCanvas.height / 2, rCanvas.width, rCanvas.height / 2);

    const numRays = rCanvas.width;
    const halfFov = player.fov / 2;

    for (let r = 0; r < numRays; r++) {
      let rayAngle = player.dir - halfFov + (r / numRays) * player.fov;
      let cos = Math.cos(rayAngle);
      let sin = Math.sin(rayAngle);
      let dist = 0;
      let hit = false;
      let wallType = 1;

      while (!hit && dist < 16) {
        dist += 0.04;
        let checkX = Math.floor(player.x + cos * dist);
        let checkY = Math.floor(player.y + sin * dist);

        if (checkX < 0 || checkX >= mapSize || checkY < 0 || checkY >= mapSize) {
          hit = true; break;
        }
        if (map[checkY][checkX] === 1) {
          hit = true;
          wallType = (checkX + checkY) % TEX_WALL.length;
        }
      }

      // Correct fish-eye distortion
      let correctedDist = dist * Math.cos(rayAngle - player.dir);
      let wallHeight = Math.min(rCanvas.height, (rCanvas.height / correctedDist));

      let shade = Math.max(0.1, 1 - correctedDist / 14);
      rCtx.fillStyle = TEX_WALL[wallType];
      rCtx.globalAlpha = shade;
      rCtx.fillRect(r, (rCanvas.height - wallHeight) / 2, 1, wallHeight);
      rCtx.globalAlpha = 1.0;
    }

    // Check items collection
    let uncollected = 0;
    items.forEach(it => {
      if (!it.collected) {
        let dx = it.x - player.x;
        let dy = it.y - player.y;
        if (Math.hypot(dx, dy) < 0.5) {
          it.collected = true;
          score += 50;
          document.getElementById('scoreVal').textContent = score;
          if (window.SFX) SFX.play('coin');
        } else {
          uncollected++;
        }
      }
    });
    document.getElementById('nodesVal').textContent = uncollected;

    // Check Level Exit
    if (uncollected === 0 && Math.hypot(exitPos.x - player.x, exitPos.y - player.y) < 0.7) {
      if (window.SFX) SFX.play('win');
      if (level >= 20) {
        isPlaying = false;
        if (window.Arcade) { Arcade.best('3d-raycaster', score, 20); Arcade.confetti(); }
        showModal('VICTORY!', `You mastered all 20 3D mazes with a total score of ${score}!`, 'REPLAY', () => { score = 0; startLevel(1); });
      } else {
        isPlaying = false;
        showModal(`LEVEL ${level} CLEARED!`, 'Data crystals collected. Ready for the next 3D labyrinth?', `NEXT LEVEL (${level + 1})`, () => startLevel(level + 1));
      }
    }

    renderMinimap();
    requestAnimationFrame(render);
  }

  function renderMinimap() {
    mCtx.clearRect(0, 0, mCanvas.width, mCanvas.height);
    let scale = mCanvas.width / mapSize;
    for (let r = 0; r < mapSize; r++) {
      for (let c = 0; c < mapSize; c++) {
        if (map[r][c] === 1) {
          mCtx.fillStyle = '#6d28d9';
          mCtx.fillRect(c * scale, r * scale, scale, scale);
        }
      }
    }
    // Items
    mCtx.fillStyle = '#f59e0b';
    items.forEach(it => {
      if (!it.collected) {
        mCtx.beginPath();
        mCtx.arc(it.x * scale, it.y * scale, scale * 0.3, 0, Math.PI * 2);
        mCtx.fill();
      }
    });
    // Exit
    mCtx.fillStyle = '#22c55e';
    mCtx.fillRect((exitPos.x - 0.4) * scale, (exitPos.y - 0.4) * scale, scale * 0.8, scale * 0.8);

    // Player
    mCtx.fillStyle = '#a855f7';
    mCtx.beginPath();
    mCtx.arc(player.x * scale, player.y * scale, scale * 0.4, 0, Math.PI * 2);
    mCtx.fill();
  }

  function move(dist) {
    let nx = player.x + Math.cos(player.dir) * dist;
    let ny = player.y + Math.sin(player.dir) * dist;
    if (map[Math.floor(ny)][Math.floor(nx)] === 0) {
      player.x = nx; player.y = ny;
      if (window.SFX) SFX.play('step');
    }
  }

  function turn(angle) {
    player.dir += angle;
    if (window.SFX) SFX.play('whoosh');
  }

  function showModal(title, desc, btnText, action) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalDesc').textContent = desc;
    let b = document.getElementById('modalBtn');
    b.textContent = btnText;
    b.onclick = action;
    document.getElementById('overlayModal').style.display = 'flex';
  }

  // Bind Touch Controls
  document.getElementById('btnFwd').addEventListener('click', () => move(0.35));
  document.getElementById('btnBack').addEventListener('click', () => move(-0.35));
  document.getElementById('btnLeft').addEventListener('click', () => turn(-0.25));
  document.getElementById('btnRight').addEventListener('click', () => turn(0.25));

  // Bind Keyboard
  window.addEventListener('keydown', (e) => {
    if (!isPlaying) return;
    if (e.key === 'w' || e.key === 'ArrowUp') move(0.35);
    if (e.key === 's' || e.key === 'ArrowDown') move(-0.35);
    if (e.key === 'a' || e.key === 'ArrowLeft') turn(-0.25);
    if (e.key === 'd' || e.key === 'ArrowRight') turn(0.25);
  });

  // Start Level 1
  showModal('3D Raycaster', 'Navigate 3D labyrinths using raycasting projection. Collect all data crystals to unlock the exit portal!', 'START LEVEL 1', () => startLevel(1));
  requestAnimationFrame(render);
</script>
</body>
</html>
