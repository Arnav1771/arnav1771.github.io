<!--
  The shell holds the chrome and nothing else. Whichever world is mounted builds
  the whole of #stage, including its own atmosphere layers - which is why the
  two no longer look like one page with a filter over it.
-->

<div class="crossing" id="crossing" aria-hidden="true">
  <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
</div>
<div class="crossing-word" id="crossing-word" aria-hidden="true"></div>

<header class="index">
  <span class="who">Arnav</span>
  <ol>
    <li><a href="#opening"><span class="num">01</span>Story</a></li>
    <li><a href="#ramp"><span class="num">02</span>Ramp</a></li>
    <li><a href="#years"><span class="num">03</span>Years</a></li>
    <li><a href="#arsenal"><span class="num">04</span>Written in</a></li>
    <li><a href="#archive"><span class="num">05</span>Archive</a></li>
  </ol>
  <div class="worlds" role="group" aria-label="Visual world">
    <button type="button" data-world="professional" aria-pressed="true"><span>Archive</span></button>
    <button type="button" data-world="anime" aria-pressed="false"><span>Signal</span></button>
  </div>
</header>

<!--
  The rail sits outside the index bar on purpose. That bar blends with
  difference so it stays legible over both worlds, and a blended group takes
  its children with it - inside the header the red rail came out cyan.
-->
<div class="progress" aria-hidden="true"><i id="progress"></i></div>

<main id="stage"></main>
